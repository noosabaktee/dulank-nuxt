<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dulank</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/contact-inline.css">
</head>
<body>
    <header>
        <div id="navbar-placeholder"></div>
    </header>

    <main>
        <!-- Main Content Area (placeholder) -->
        <div class="container my-5">

            <div class="row text-standard">
                <div class="col-md-6">
                    <p class="fs-6">Contact Us</p>
                    <form>
                        <div class="form-group my-4">
                          <label class="my-1" for="name">Name</label>
                          <input type="text" class="form-control" id="name" placeholder="Your Name">
                        </div>
                        <div class="form-group my-4">
                          <label class="my-1" for="email">Email</label>
                          <input type="text" class="form-control" id="email" placeholder="Your Email">
                        </div>
                        <div class="form-group my-4">
                          <label class="my-1" for="phone">Phone</label>
                          <input type="text" class="form-control" id="phone" placeholder="Your Phone">
                        </div>
                        <div class="form-group my-4">
                          <label class="my-1" for="message">Message</label>
                          <textarea class="form-control" id="message" rows="3"></textarea>
                        </div>
                        <small class="d-none text-standard text-danger" id="info-selected-all"><i class="fa-solid fa-circle-info"></i> please input your message<br></small>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn my-btn-primary my-4 w-50" id="send">Send</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6">
                    <p class="fs-6">Our Shop Location</p>
                    <p>Alamat kami : Jl. Arif Rahman Hakim / Niaga (depan stasiun) Karawang Kel. Nagasari Kec. Karawang Barat Kab. Karawang Jawa Barat</p>
                    <div>
                        <iframe class="w-100" height="400" src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d15862.718289330365!2d107.299863!3d-6.305763!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69765284335fd5%3A0x91110be4c9c4c9d4!2sPercetakan%20Dulank%20PT.%20Dulank%20Semesta%20Cida!5e0!3m2!1sid!2sid!4v1746143056651!5m2!1sid!2sid" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" id="inline-style-contact-001"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer-placeholder"></div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/component.js"></script>
    <script src="js/pages/contact.js"></script>
</body>
</html>
