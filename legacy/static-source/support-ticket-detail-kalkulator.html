<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/support-ticket-detail-kalkulator-inline.css">
</head>
<body>
    <header>
        <div id="navbar-kalkulator-placeholder"></div>
    </header>


    <main>

        <!-- Main Content Area (placeholder) -->
        <div class="container my-5">
            <div class="row">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3 mb-4" id="sidebar-kalkulator-placeholder"></div>

                <!-- Main Profile Content -->
                <div class="col-lg-9">
                    <!-- Ticket Detail & Message Area -->
                    <div class="mb-4">
                        <!-- Ticket Messages -->
                        <div class="mb-3">
                            <div class="d-flex mb-2">
                                <img src="images/profile.png" alt="avatar" class="object-fit-cover rounded-circle me-2" id="inline-style-support-ticket-detail-kalkulator-001">
                                <div>
                                    <div class="fw-semibold small">159651</div>
                                    <div class="small my-1">Cara Minta Bukti/Resi Pengiriman</div>
                                    <div class="text-secondary text-standard mb-2">2025-08-07 12:38:00</div>
                                </div>
                            </div>
                            <hr class="my-3">
                            <div class="d-flex mb-2">
                                <img src="images/profile.png" alt="avatar" class="object-fit-cover rounded-circle me-2" id="inline-style-support-ticket-detail-kalkulator-002">
                                <div>
                                    <div class="small my-1">halo</div>
                                    <div class="text-secondary text-standard">2025-08-14 12:18:06</div>
                                </div>
                            </div>
                            <hr class="my-3">
                        </div>
                        <!-- Leave a Message -->
                        <div class="mb-2 fw-semibold small">Leave a Message</div>
                        <form>
                            <div class="mb-3">
                                <textarea class="form-control text-standard" rows="4" placeholder="Write your message here..."></textarea>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="closeTicket">
                                <label class="form-check-label text-standard" for="closeTicket">Submit and close the ticket</label>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn my-btn-primary px-4">Submit message</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer-placeholder"></div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/component.js"></script>
    <script src="js/kalkulator.js"></script>
</body>
</html>
