<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semua Toko Kertas</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/semua-toko-kertas-inline.css">
</head>
<body>
    <header>
        <div id="navbar-kalkulator-placeholder"></div>
    </header>

    <main>
        <!-- Main Content Area (placeholder) -->
        <div class="container my-5">
            <div class="row">
                <!-- Sidebar Navigation -->
                <div class="col-lg-3 mb-4" id="sidebar-kalkulator-placeholder"></div>

                <!-- Main Profile Content -->
                <div class="col-lg-9">
                    <h4 class="fs-5 mb-3">Semua Toko Kertas</h4>
                    <div class="mb-2">
                        <span class="text-standard"><i class="bi bi-geo-alt-fill me-2"></i>Dilokasi anda terdaftar
                            beberapa Toko Kertas!</span>
                    </div>
                    <div id="formSearch">
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-standard">Cari Nama Toko Kertas</label>
                                <div class="input-group">
                                    <input type="text" class="form-control text-standard" placeholder="Nama Toko Kertas">
                                    <span class="input-group-text"><i class="fa fa-search"></i></span>
                                </div>
                            </div>
                            <div class="row">
                                <div class="mb-3 col-md-4">
                                    <label class="form-label text-standard">Provinsi</label>
                                    <select class="form-select text-standard">
                                        <option>Jawa Barat (26 Percetakan)</option>
                                        <!-- Tambahkan opsi lain sesuai kebutuhan -->
                                    </select>
                                </div>
                                <div class="mb-3 col-md-4">
                                    <label class="form-label text-standard">Kabupaten</label>
                                    <select class="form-select text-standard">
                                        <option>Karawang (10 Percetakan)</option>
                                        <!-- Tambahkan opsi lain sesuai kebutuhan -->
                                    </select>
                                </div>
                                <div class="mb-3 col-md-4 ps-md-0">
                                    <label class="form-label text-standard">Kecamatan</label>
                                    <select class="form-select text-standard">
                                        <option>Telukjambe Timur (3 Percetakan)</option>
                                        <!-- Tambahkan opsi lain sesuai kebutuhan -->
                                    </select>
                                </div>
                            </div>
                        </form>
                        <div class="d-flex justify-content-end ps-md-3">
                            <button class="btn my-btn-primary mt-2 col-md-4 col-6" type="button">Search</button>
                        </div>
                    </div>

                    <div>
                        <div class="card border-0 shadow-sm mb-3">
                            <div class="d-md-flex align-items-center p-3 justify-content-between">
                                <!-- Foto Toko -->
                                <div class="d-flex">
                                    <img src="images/tab.png" alt="Foto Toko" class="rounded-circle me-3" id="inline-style-semua-toko-kertas-001">
                                    <div class="flex-grow-1">
                                        <div class="fw-bold fs-6 mb-1">Toko Kertasindo</div>
                                        <div class="text-secondary text-standard mb-1">Jakarta, Jakarta Pusat, Kemayoran</div>
                                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                            <span class="text-standard fw-bold">5,3RB</span>
                                            <span class="text-standard text-secondary small">Pengikut</span>
                                            <span class="text-standard text-secondary mx-1">|</span>
                                            <span class="text-standard fw-bold">195</span>
                                            <span class="text-standard text-secondary small">Mengikuti</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="d-md-flex">
                                    <div class="d-flex flex-row justify-content-between align-items-center ms-md-4 gap-3 mt-3 mt-md-0">
                                        <div class="d-flex flex-column align-items-center">
                                            <span class="fw-bold small">117</span>
                                            <span class="text-secondary text-standard">Group Kertas</span>
                                        </div>
                                        <div class="d-flex flex-column align-items-center">
                                            <span class="fw-bold small">4</span>
                                            <span class="text-secondary text-standard text-center">Jenis Kertas</span>
                                        </div>
                                    </div>
                                    <div class="d-flex flex-md-column ms-md-4 mt-3 mt-md-0">
                                        <a href="store-kertas.html" class="btn my-btn-outline-primary col-6 col-md-12 me-2 me-md-0 mb-md-2 px-3 py-1">VISIT</a>
                                        <button class="btn my-btn-outline-primary col-6 col-md-12 px-3 py-1" type="button">IKUTI</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            ...
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Save changes</button>
        </div>
        </div>
    </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/easy-number-separator.js"></script>
    <script src="js/component.js"></script>
    <script src="js/kalkulator.js"></script>
</body>
</html>
