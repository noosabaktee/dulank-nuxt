<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container d-flex justify-content-between">
                <a class="navbar-brand fw-bold" href="/">Dulank.</a>
                <span class="navbar-brand fw-light">Forgot Password</span>
                <a class="navbar-brand text-standard" href="register.html">Belum punya akun?</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Main Content Area (placeholder) -->
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">
                    <div class="card border-0">
                        <div class="card-body p-5">
                            <h3 class="text-center mb-4 fw-normal">Forgot Account Password</h3>

                            <!-- Forgot Password Form -->
                            <form>
                                <!-- Email Field -->
                                <div class="mb-4">
                                    <input type="text" class="form-control" id="email" placeholder="Email address" required>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary my-bg-primary w-100 py-2 mb-3">
                                    Send Password Reset Link
                                </button>

                                <!-- Back to Login Link -->
                                <div class="text-center">
                                    <a href="login.html" class="text-primary text-standard">
                                        <i class="fas fa-arrow-left me-2"></i>Back to login page
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- <footer>
        <div id="footer-placeholder"></div>
    </footer> -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/component.js"></script>
</body>
</html>
