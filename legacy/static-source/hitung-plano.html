<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Plano</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/hitung-plano.css">
    <link rel="stylesheet" href="css/pages/hitung-plano-inline.css">
</head>
<body>
  <div class="container py-5">
    <h2 id="inline-style-hitung-plano-001">Plano</h2>
    <form id="planoForm" class="d-md-flex d-inline-block align-items-end" data-js-submit="hitung-plano-001">
      <div class="me-3">
        <label class="mb-2">Ukuran Plano</label>
        <div class="d-flex align-items-center">
          <input type="number" class="form-control" id="plano_x" min="1"> <span class="mx-1">X</span>
          <input type="number" class="form-control" id="plano_y" min="1">
        </div>
      </div>
      <div class="me-3 mt-md-0 mt-3">
        <label class="mb-2">Ukuran Cetak</label>
        <div class="d-flex align-items-center">
          <input type="number" class="form-control" id="ukuran_cetak_x" min="1"> <span class="mx-1">X</span>
          <input type="number" class="form-control" id="ukuran_cetak_y" min="1">
        </div>
      </div>

    </form>
    <div class="row p-2 mt-3">
      <p>Layout Potong Kertas</p>
      <div class="col-lg-6">
        <div class="svg-wrap p-2 d-none" id="inline-style-hitung-plano-002">
          <svg id="planoSVG"></svg>
          <br>
          <div class="d-flex justify-content-end">
            <button class="btn my-btn-primary mt-2 me-2" id="downloadSVG" type="button">Download SVG</button>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div id="mainForm">
          <span class="text-standard my-2 d-block"><b>Qty PCS</b> <input class="form-control number-separator" type="text" id="qty"></span>
          <span class="text-standard my-2 d-block"><b>Panjang Canvas X</b> <input class="form-control number-separator" type="text" id="canvas_x"></span>
          <span class="text-standard my-2 d-block"><b>Panjang Canvas Y</b> <input class="form-control number-separator" type="text" id="canvas_y"></span>
          <span class="text-standard my-2 d-block"><b>Panjang Cetak X</b> <input class="form-control number-separator" type="text" id="cetak_x"></span>
          <span class="text-standard my-2 d-block"><b>Panjang Cetak Y</b> <input class="form-control number-separator" type="text" id="cetak_y"></span>
          <span class="text-standard my-2 d-block"><b>Posisi Kotak awal</b>
            <select class="form-select text-standard" id="posisi_awal">
              <option value="Portrait">Portrait</option>
              <option value="Landscape">Landscape</option>
            </select>
          </span>
          <span class="text-standard my-2 d-block"><b>Duplikat Kotak center X</b> <input class="form-control number-separator" type="text" id="dup_x"></span>
          <span class="text-standard my-2 d-block"><b>Duplikat Kotak center Y</b> <input class="form-control number-separator" type="text" id="dup_y"></span>
          <span class="text-standard my-2 d-block"><b>Penempatan Arah Sisa</b>
            <select class="form-select text-standard" id="arah_sisa">
              <option value="-">-</option>
              <option value="Kanan">Kanan</option>
              <option value="Bawah">Bawah</option>
            </select>
          </span>
          <span class="text-standard my-2 d-block"><b>Posisi Kotak Sisa</b>
            <select class="form-select text-standard" id="posisi_sisa">
              <option value="-">-</option>
              <option value="Portrait">Portrait</option>
              <option value="Landscape">Landscape</option>
            </select>
          </span>
          <span class="text-standard my-2 d-block"><b>kotak sisa X</b> <input class="form-control" type="text" id="sisa_x"></span>
          <span class="text-standard my-2 d-block"><b>kotak sisa Y</b> <input class="form-control" type="text" id="sisa_y"></span>
        </div>
        <div class="mt-md-0 mt-3">
          <button type="button" class="my-btn-primary btn" id="generateBtn">Generate</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pages/hitung-plano.js"></script>
  <script src="js/easy-number-separator.js"></script>
  <script src="js/component.js"></script>
    <script src="js/pages/hitung-plano-events.js"></script>
</body>
</html>
