<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container d-flex justify-content-between">
                <a class="navbar-brand fw-bold" href="/">Dulank.</a>
                <span class="navbar-brand fw-light">Login</span>
                <a class="navbar-brand text-standard" href="register.html">Belum punya akun?</a>
            </div>
        </nav>
    </header>

    <main>
        <!-- Main Content Area (placeholder) -->
        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-md-12">
                    <div class="row justify-content-center">
                        <div class="col-md-5 col-lg-6">
                            <!-- <img src="images/auth.svg" alt="" class="mt-5 mb-2 w-100 px-2"> -->
                        </div>
                        <div class="col-md-7 col-lg-6 bg-light">
                            <div class="card border-0 bg-light">
                                <div class="card-body p-lg-5 p-md-4">
                                    <h3 class="text-center mb-4 fw-normal">Login to your account</h3>

                                    <!-- Login Form -->
                                    <form action="profile.html">
                                        <!-- Email Field -->
                                        <div class="mb-3">
                                            <input type="email" class="form-control" id="email" placeholder="Email address" required>
                                        </div>

                                        <!-- Password Field -->
                                        <div class="mb-3">
                                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                                        </div>

                                        <!-- Remember Me & Forgot Password -->
                                        <div class="d-flex justify-content-between align-items-center mb-4">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                                <label class="form-check-label text-standard" for="rememberMe">Remember me</label>
                                            </div>
                                            <a href="forgot-password.html" class="text-primary text-standard">Forgot password?</a>
                                        </div>

                                        <!-- Login Button -->
                                        <button type="submit" class="btn btn-primary my-bg-primary w-100 py-2 mb-3" >
                                            Login →
                                        </button>

                                        <p class="text-muted text-standard mb-4">
                                            Don't have an account? <a href="register.html" class="text-primary">Register now</a>
                                        </p>

                                        <!-- Social Login Divider -->
                                        <div class="text-center mb-4">
                                            <hr>
                                            <span class="bg-white px-3 text-muted">
                                                or login with
                                            </span>
                                        </div>

                                        <!-- Social Login Buttons -->
                                        <div class="row g-2">
                                            <div class="col-6">
                                                <a href="#" class="btn btn-outline-primary w-100">
                                                    <i class="fab fa-facebook-f me-2"></i> Sign in with Facebook
                                                </a>
                                            </div>
                                            <div class="col-6">
                                                <a href="#" class="btn btn-outline-danger w-100">
                                                    <i class="fab fa-google me-2"></i> Sign in with Google
                                                </a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer-placeholder"></div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/component.js"></script>
</body>
</html>
